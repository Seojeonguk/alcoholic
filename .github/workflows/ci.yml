# PR마다 lint · 단위 테스트 · 번들 빌드 · 보안 규칙 테스트를 자동으로 돌림
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint · 단위 테스트 · 번들
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      # lint가 functions/의 import를 확인하므로 함수 패키지도 설치함
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm run test:unit
      - run: npx expo export --platform android --output-dir ${{ runner.temp }}/export

  rules:
    name: 보안 규칙 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Firestore · Storage 에뮬레이터는 Java 21 이상이 필요함
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # 에뮬레이터 jar를 매번 받지 않게 캐시함
      - uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run test:rules
